name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "apps/web/**"
      - "packages/conference/**"
      - "packages/media/**"
      - "packages/protocol/**"
      - "packages/webrtc/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "docs/deployment.md"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/site/**"
      - "packages/media/**"
      - "packages/protocol/**"
      - "packages/webrtc/src/codec-policy.ts"
      - "packages/webrtc/src/codecs.ts"
      - "packages/webrtc/package.json"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: verge-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install workspace
        run: pnpm install --no-frozen-lockfile

      - name: Test site contract
        run: pnpm --filter @verge/site test

      - name: Typecheck site
        run: pnpm --filter @verge/site typecheck

      - name: Typecheck conference client
        run: pnpm --filter @verge/web typecheck

      - name: Test conference client
        run: pnpm --filter @verge/web test

      - name: Build Vite 8 site
        env:
          BASE_PATH: /verge
          PUBLIC_VERGE_APP_URL: /verge/app/
        run: pnpm --filter @verge/site build

      - name: Build conference client for Pages
        env:
          BASE_PATH: /verge/app/
          VITE_SIGNALING_URL: ${{ vars.VERGE_SIGNALING_URL }}
          VITE_ICE_CONFIG_URL: ${{ vars.VERGE_ICE_CONFIG_URL }}
          VITE_ROOM_INVITE_URL: ${{ vars.VERGE_ROOM_INVITE_URL }}
        run: pnpm --filter @verge/web build

      - name: Verify Pages artifact
        shell: bash
        run: |
          test -s apps/site/dist/index.html
          test -s apps/site/dist/onboarding/index.html
          grep -q 'Meet at the edge' apps/site/dist/index.html
          grep -q 'Get ready for Verge' apps/site/dist/onboarding/index.html
          test -s apps/web/dist/index.html
          grep -q '/verge/app/assets/' apps/web/dist/index.html
          if grep -R -E '(astro|esbuild)' apps/site/dist >/dev/null 2>&1; then
            echo "Built presentation artifact contains retired Astro/esbuild references"
            exit 1
          fi

      - name: Include conference client in Pages artifact
        run: |
          mkdir -p apps/site/dist/app
          cp -a apps/web/dist/. apps/site/dist/app/
          test -s apps/site/dist/app/index.html

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
