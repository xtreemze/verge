name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Android harness syntax
        run: bash -n scripts/adb-two-phone-mvp.sh

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @verge/web exec playwright install --with-deps chromium

      - name: Browser smoke tests
        run: pnpm test:e2e

      - name: Start coturn relay
        run: >-
          docker run --rm -d
          --name verge-coturn
          --network host
          coturn/coturn:4.18.0-r0
          -n
          --log-file=stdout
          --realm=verge.test
          --lt-cred-mech
          --user=verge:vergepass
          --fingerprint
          --no-cli
          --min-port=49160
          --max-port=49200

      - name: Browser TURN relay certification
        env:
          VERGE_E2E_RELAY: "1"
        run: pnpm test:e2e
